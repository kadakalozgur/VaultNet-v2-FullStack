<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultNet - My Vault</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="CSS/myvault.css" />
    <link rel="stylesheet" href="CSS/vaultitem.css" />
    <link rel="stylesheet" href="CSS/navbar.css" />
  </head>
  <body
    class="myvault-background min-vh-100 p-2 p-lg-4 d-flex align-items-stretch"
  >
    <div
      class="container-fluid p-0 shadow-lg d-flex flex-column animate__animated animate__fadeIn animate__faster"
      style="border-radius: 24px; overflow: hidden; background-color: #f8fafc"
    >
      <div class="row m-0 flex-grow-1 dashboard-row">
        <div
          class="col-12 sidebar bg-white p-4 d-flex flex-column"
          style="border-right: 1px solid #e5e7eb"
        >
          <h4 class="ml-1" style="color: #111827">
            VaultNet <span style="color: #4965fa">v2</span>
          </h4>
          <hr class="w-100 mt-2 mb-4" />

          <nav class="nav flex-column mb-auto">
            <a href="dashboard.html" class="custom-nav-link">
              <img
                src="Media/Icons/dashboard-icon.png"
                class="nav-icon"
                alt="Dashboard"
              />
              Dashboard
            </a>
            <a href="myvault.html" class="custom-nav-link active">
              <img
                src="Media/Icons/myvault-active-icon.png"
                class="nav-icon"
                alt="My Vault"
              />
              My Vault
            </a>
          </nav>
          <div class="mt-auto">
            <hr class="mb-3" />

            <a
              href="myprofile.html"
              class="custom-nav-link d-flex justify-content-between align-items-center"
              style="margin-bottom: 0"
            >
              <div class="d-flex align-items-center">
                <img
                  src="Media/Icons/avatar-icon.png"
                  class="profile-avatar-img"
                  alt="Profile"
                />
                <span class="ml-3" style="font-size: 16px; color: #111827"
                  >My Profile</span
                >
              </div>

              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#6b7280"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </a>
            <button
              type="button"
              id="logout-button"
              class="btn btn-block mt-3 font-weight-bold d-flex align-items-center justify-content-start logout-btn"
            >
              <img
                src="Media/Icons/logout-icon.png"
                class="logout-icon"
                alt="Log out"
              />
              Log out
            </button>
          </div>
        </div>
        <div class="col-12 main-content p-4 p-lg-5">
          <div class="mb-4">
            <div class="d-flex align-items-center mb-1">
              <a
                href="myvault.html"
                class="btn btn-link p-0 mr-2 shadow-none d-flex align-items-center justify-content-center"
                style="color: #111827"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </a>
              <h3 class="font-weight-bold text-dark mb-0">My Vault</h3>
            </div>
            <p
              class="text-muted mb-0"
              style="font-size: 14px; margin-left: 32px"
            >
              Manage and organize your secure credentials and sensitive
              information in one place.
            </p>
          </div>

          <div
            class="myvault-background w-100 shadow-sm p-4 p-lg-5"
            style="border-radius: 20px; min-height: 650px"
          >
            <div class="d-flex align-items-center mb-4">
              <div
                class="mr-4 d-flex align-items-center justify-content-center flex-shrink-0 bg-white shadow-sm"
                style="
                  border-radius: 16px;
                  width: 125px;
                  height: 125px;
                  padding: 12px;
                "
              >
                <img
                  id="item-icon"
                  src="Media/Icons/items-default-icon.png"
                  alt="Item Icon"
                  style="max-width: 100%; max-height: 100%; border-radius: 8px"
                />
              </div>
              <div>
                <h2
                  id="title-label"
                  class="font-weight-bold text-dark mb-0"
                  style="font-size: 30px; letter-spacing: -0.5px"
                >
                  Title
                </h2>
              </div>
            </div>

            <div class="d-flex mb-5">
              <button
                class="btn btn-vault-edit d-flex align-items-center justify-content-center px-4 py-2 mr-3 font-weight-bold"
              >
                <img
                  src="Media/Icons/pencil-icon.png"
                  alt="Edit"
                  style="width: 25px; height: 25px"
                  class="mr-2"
                />
                Edit
              </button>

              <button
                class="btn btn-vault-delete d-flex align-items-center justify-content-center px-4 py-2 font-weight-bold"
              >
                <img
                  src="Media/Icons/trash-icon.png"
                  alt="Delete"
                  style="width: 20px; height: 20px"
                  class="mr-2"
                />
                Delete
              </button>
            </div>

            <div class="vault-details-container w-100 p-4 p-lg-5">
              <div class="row">
                <div class="col-12 col-lg-7 pr-lg-5">
                  <div class="form-group mb-4">
                    <label
                      class="d-flex align-items-center small font-weight-bold text-muted text-uppercase mb-2"
                      style="letter-spacing: 0.5px"
                    >
                      <img
                        src="Media/Icons/user-icon.png"
                        alt="User"
                        style="width: 22px; height: 22px"
                        class="mr-2"
                      />
                      Username / Email
                    </label>
                    <div
                      class="d-flex align-items-center bg-light border rounded px-3 py-2"
                    >
                      <input
                        type="text"
                        id="detail-username"
                        class="form-control-plaintext p-0 font-weight-bold text-dark"
                        readonly
                      />
                      <button
                        type="button"
                        class="btn btn-sm btn-link p-0 ml-2 shadow-none"
                        onclick="copyToClipboard('detail-username', true)"
                      >
                        <img
                          src="Media/Icons/copy-icon.png"
                          alt="Copy"
                          style="width: 18px"
                        />
                      </button>
                    </div>
                  </div>

                  <div class="form-group mb-4">
                    <label
                      class="d-flex align-items-center small font-weight-bold text-muted text-uppercase mb-2"
                      style="letter-spacing: 0.5px"
                    >
                      <img
                        src="Media/Icons/blue-lock-icon.png"
                        alt="Lock"
                        style="width: 18px; height: 18px"
                        class="mr-2"
                      />
                      Password
                    </label>
                    <div
                      class="d-flex align-items-center bg-light border rounded px-3 py-2"
                    >
                      <input
                        type="password"
                        id="detail-password"
                        class="form-control-plaintext p-0 font-weight-bold text-dark"
                        readonly
                      />
                      <button
                        type="button"
                        id="toggle-view-password"
                        class="btn btn-sm btn-link p-0 ml-2 shadow-none"
                      >
                        <img
                          id="detail-eye-icon"
                          src="Media/Icons/open-eye-blue-icon.png"
                          alt="Toggle"
                          style="width: 18px"
                        />
                      </button>
                      <button
                        type="button"
                        class="btn btn-sm btn-link p-0 ml-3 shadow-none"
                        onclick="copyToClipboard('detail-password', true)"
                      >
                        <img
                          src="Media/Icons/copy-icon.png"
                          alt="Copy"
                          style="width: 18px"
                        />
                      </button>
                    </div>
                  </div>

                  <div class="form-group mb-0" id="detail-domain-wrapper">
                    <label
                      class="d-flex align-items-center small font-weight-bold text-muted text-uppercase mb-2"
                      style="letter-spacing: 0.5px"
                    >
                      <img
                        src="Media/Icons/link-icon.png"
                        alt="Website"
                        style="width: 22px; height: 22px"
                        class="mr-2"
                      />
                      Website
                    </label>
                    <div
                      class="d-flex align-items-center bg-light border rounded px-3 py-2"
                    >
                      <input
                        type="text"
                        id="detail-domain"
                        class="form-control-plaintext p-0 font-weight-bold text-primary"
                        readonly
                        placeholder="No URL"
                      />
                      <button
                        type="button"
                        class="btn btn-sm btn-link p-0 ml-3 shadow-none"
                        onclick="copyToClipboard('detail-password', true)"
                      >
                        <img
                          src="Media/Icons/copy-icon.png"
                          alt="Copy"
                          style="width: 18px"
                        />
                      </button>
                    </div>
                  </div>
                </div>

                <div
                  class="col-12 col-lg-5 pl-lg-5 border-left d-flex flex-column justify-content-center mt-4 mt-lg-0 pt-4 pt-lg-0"
                >
                  <div class="d-flex align-items-center mb-4">
                    <img
                      src="Media/Icons/calendar-icon.png"
                      alt="Created"
                      style="width: 25px; height: 25px"
                      class="mr-3 opacity-50"
                    />
                    <div>
                      <div
                        class="small font-weight-bold text-muted text-uppercase"
                        style="letter-spacing: 0.5px"
                      >
                        Created
                      </div>
                      <div
                        id="detail-created-date"
                        class="font-weight-bold text-dark mt-1"
                      >
                        Date
                      </div>
                    </div>
                  </div>

                  <div class="d-flex align-items-center">
                    <img
                      src="Media/Icons/updated-icon.png"
                      alt="Modified"
                      style="width: 25px; height: 25px"
                      class="mr-3 opacity-50"
                    />
                    <div>
                      <div
                        class="small font-weight-bold text-muted text-uppercase"
                        style="letter-spacing: 0.5px"
                      >
                        Last Modified
                      </div>
                      <div
                        id="detail-updated-date"
                        class="font-weight-bold text-dark mt-1"
                      >
                        Date
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
      integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
      crossorigin="anonymous"
    ></script>
    <script src="JS/helpers.js"></script>
    <script src="JS/config.js"></script>
    <script src="JS/services/authService.js"></script>
    <script src="JS/services/vaultItemService.js"></script>
    <script src="JS/navbar.js"></script>
    <script src="JS/pages/vaultitem.js"></script>
  </body>
</html>
