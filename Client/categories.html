<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultNet - Categories</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="CSS/categories.css" />
    <link rel="stylesheet" href="CSS/navbar.css" />
    <link rel="stylesheet" href="CSS/global-loader.css" />
  </head>
  <body
    class="categories-background min-vh-100 p-2 p-lg-4 d-flex align-items-stretch"
  >
    <div
      class="container-fluid p-0 shadow-lg d-flex flex-column animate__animated animate__fadeIn animate__faster"
      style="border-radius: 24px; overflow: hidden; background-color: #f8fafc"
    >
      <div class="row m-0 flex-grow-1 dashboard-row">
        <div
          class="col-12 sidebar bg-white p-4 d-flex flex-column"
          style="border-right: 1px solid #e5e7eb"
        >
          <h4 class="ml-1" style="color: #111827">
            VaultNet <span style="color: #4965fa">v2</span>
          </h4>
          <hr class="w-100 mt-2 mb-4" />

          <nav class="nav flex-column mb-auto">
            <a href="dashboard.html" class="custom-nav-link">
              <img
                src="Media/Icons/dashboard-icon.png"
                class="nav-icon"
                alt="Dashboard"
              />
              Dashboard
            </a>
            <a href="myvault.html" class="custom-nav-link">
              <img
                src="Media/Icons/myvault-icon.png"
                class="nav-icon"
                alt="My Vault"
              />
              My Vault
            </a>
            <a href="favorites.html" class="custom-nav-link">
              <img
                src="Media/Icons/favorite-icon.png"
                class="nav-icon"
                alt="Favorites"
              />
              Favorites
            </a>
            <a href="categories.html" class="custom-nav-link active">
              <img
                src="Media/Icons/folder-icon-active.png"
                class="nav-icon"
                alt="Categories"
              />
              Categories
            </a>
            <a href="passwordgenerator.html" class="custom-nav-link">
              <img
                src="Media/Icons/key-icon.png"
                class="nav-icon"
                alt="Generator"
              />
              Password Generator
            </a>
            <a href="myprofile.html" class="custom-nav-link">
              <img
                src="Media/Icons/profile-icon.png"
                class="nav-icon"
                alt="Profile"
              />
              Profile
            </a>         
          </nav>

          <div class="mt-auto w-100">
            <hr class="mb-3" />

            <div class="dropup w-100">
              <a
                href="#"
                class="custom-nav-link d-flex justify-content-between align-items-center w-100 mb-0 text-decoration-none"
                id="profileDropdown"
                data-toggle="dropdown"
                aria-haspopup="true"
                aria-expanded="false"
              >
                <div class="d-flex align-items-center">
                  <img
                    src="Media/Icons/avatar-icon.png"
                    class="profile-avatar-img"
                    alt="Profile"
                  />
                  <span class="ml-3 font-weight-bold text-dark"
                    >My Account</span
                  >
                </div>

                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#6b7280"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="18 15 12 9 6 15"></polyline>
                </svg>
              </a>

              <div
                class="dropdown-menu w-100 shadow border-0 rounded-lg mb-2"
                aria-labelledby="profileDropdown"
              >
                <a
                  class="dropdown-item py-2 d-flex align-items-center"
                  href="myprofile.html"
                >
                  <img
                    src="Media/Icons/settings-icon.png"
                    alt="Profile"
                    class="mr-2"
                    style="width: 18px"
                  />
                  <span class="font-weight-bold text-dark"
                    >Profile Settings</span
                  >
                </a>

                <div class="dropdown-divider"></div>

                <button
                  class="dropdown-item py-2 d-flex align-items-center text-danger"
                  type="button"
                  id="logout-button"
                >
                  <img
                    src="Media/Icons/logout-icon.png"
                    alt="Logout"
                    class="mr-2"
                    style="width: 18px"
                  />
                  <span class="font-weight-bold">Log out</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 main-content p-4 p-lg-5">
          <div class="d-flex align-items-center mb-5">
            <div
              class="mr-3 d-flex align-items-center justify-content-center flex-shrink-0 pg-header-icon-box"
            >
              <img
                src="Media/Icons/folder-icon-active.png"
                alt="Categories Icon"
                style="width: 32px; height: 32px"
              />
            </div>
            <div class="mb-0">
              <h3 class="font-weight-bold text-dark mb-1">Categories</h3>
              <p class="text-muted mb-0" style="font-size: 14px">
                Create and manage custom categories to organize your vault
                items.
              </p>
            </div>
          </div>

          <div
            class="bg-white p-3 p-md-4 shadow-sm"
            style="border-radius: 20px"
          >
            <div class="d-flex align-items-center mb-3">
              <img
                src="Media/Icons/folder-icon.png"
                style="width: 30px; height: 30px"
                class="mr-2"
                alt="Categories Icon"
              />
              <h4
                class="mb-0 font-weight-bold"
                style="color: #1e1b4b; font-size: 21px"
              >
                My Categories
              </h4>
            </div>

            <div class="d-flex flex-column flex-md-row align-items-center">
              <div
                class="position-relative flex-grow-1 w-100 mr-md-3 mb-3 mb-md-0"
              >
                <img
                  src="Media/Icons/search-icon.png"
                  class="vault-search-icon"
                  alt="Search"
                />
                <input
                  type="text"
                  class="form-control border-0 w-100 vault-search-input"
                  placeholder="Search categories..."
                  id="category-search-input"
                />
              </div>

              <button
                type="button"
                class="btn text-white font-weight-bold px-4 d-flex align-items-center justify-content-center flex-shrink-0 vault-add-btn"
                id="open-add-category-modal-button"
              >
                <img
                  src="Media/Icons/add-icon.png"
                  style="width: 18px; height: 18px"
                  class="mr-2"
                  alt="Add"
                />
                Create Category
              </button>
            </div>
          </div>

          <div class="row mt-4" id="categories-container">
            <!-- script ile burası doluyor o yüzden bir şey yazmadım. categories.js içinde -->
          </div>
          <div
            id="pagination-container"
            class="d-flex justify-content-center align-items-center"
          >
            <!-- script ile burası doluyor o yüzden bir şey yazmadım. categories.js içinde -->
          </div>
        </div>
      </div>
    </div>

    <!--Modal Kısımları -->

    <!-- Kategori Oluşturma Modal Kısmı-->

    <div class="modal fade" id="addCategoryModal">
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content border-0 shadow-lg"
          style="border-radius: 16px"
        >
          <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
            <h5 class="modal-title font-weight-bold text-dark">
              Create New Category
            </h5>
          </div>

          <div class="modal-body px-4 py-3">
            <p class="text-muted mb-4" style="font-size: 14px">
              Give your new category a name to keep your vault organized.
            </p>

            <div
              id="add-category-alert"
              class="alert d-none animate__animated animate__fadeIn"
              role="alert"
            ></div>

            <div class="form-group mb-0">
              <label style="font-weight: bold; font-size: 14px; color: #334155"
                >Category Name <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="add-category-name-input"
                class="form-control"
                placeholder="Social Media, Gaming, Bank ..."
                style="border-radius: 7px; color: #334155"
              />
            </div>
          </div>

          <div class="modal-footer border-top-0 pt-3 pb-4 px-4">
            <button
              type="button"
              class="btn btn-outline-secondary font-weight-bold px-4 close-modal-btn"
              style="border-radius: 8px"
              id="cancel-add-category-modal-button"
            >
              Cancel
            </button>

            <button
              type="button"
              id="save-category-button"
              class="btn text-white font-weight-bold px-4"
              style="background-color: #4965fa; border-radius: 8px"
            >
              Create
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
      integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
      crossorigin="anonymous"
    ></script>
    <script src="JS/helpers.js"></script>
    <script src="JS/config.js"></script>
    <script src="JS/services/authService.js"></script>
    <script src="JS/services/categoryService.js"></script>
    <script src="JS/navbar.js"></script>
    <script src="JS/pages/categories.js"></script>
  </body>
</html>
