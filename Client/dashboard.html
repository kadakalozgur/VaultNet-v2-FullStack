<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultNet - Dashboard</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="CSS/dashboard.css" />
  </head>
  <body class="dashboard-background min-vh-100">
    <div class="container-fluid p-0">
      <div class="row m-0 min-vh-100">
        <div class="col-12 col-lg-3 p-3 p-lg-4">
          <div
            class="card h-100 shadow border-0"
            style="
              background-color: rgba(255, 255, 255, 0.7);
              border-radius: 24px;
            "
          >
            <div class="card-body">
              <h2 class="card-title text-center mt-3">
                VaultNet
                <span style="color: #4965fa">v2</span>
              </h2>

              <hr />
              <p class="card-text">Dashboard</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-9 p-3 p-lg-4">
          <div
            class="card h-100 shadow border-0"
            style="
              background-color: rgba(255, 255, 255, 0.7);
              border-radius: 24px;
            "
          >
            <div class="card-body"></div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
      integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
